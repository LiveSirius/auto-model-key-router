name: Release

on:
  push:
    branches: [master]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: write
  # 构建出的镜像推到 GHCR，需要 packages 写权限。
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read package version
        id: package
        run: |
          version=$(python - <<'PY'
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Stop if release already exists
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.existing_release.outputs.exists == 'false'
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        if: steps.existing_release.outputs.exists == 'false'
        run: python -m build

      - name: Check distributions
        if: steps.existing_release.outputs.exists == 'false'
        run: python -m twine check dist/*

      - name: Smoke test wheel
        if: steps.existing_release.outputs.exists == 'false'
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --upgrade pip
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/auto-model-key-router --help
          .release-smoke/bin/amkr --help
          .release-smoke/bin/python -c "from auto_model_key_router.visitor import visitor_feature_available; assert not visitor_feature_available()"
          wheel=$(find dist -name '*.whl' -print -quit)
          .release-smoke/bin/python -m pip install "${wheel}[visitor]"
          .release-smoke/bin/python -c "from auto_model_key_router.visitor import visitor_feature_available; assert visitor_feature_available()"

      # 镜像在「创建 GitHub Release」之前构建并推送：gh release create 才会建 tag，
      # 推送若失败则 tag 与 release 都不存在，重跑时这些步骤不会被 existing_release
      # 的跳过条件挡掉。反过来放在最后，一次网络抖动就会留下「release 已建、镜像没推」
      # 且重跑永远跳过镜像步骤的半成品状态。
      - name: Build container image
        if: steps.existing_release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          # GHCR 只接受小写仓库名，而 GITHUB_REPOSITORY 带原始大小写（本仓库是 Sparrived）。
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --tag "$image:$VERSION" --tag "$image:latest" .

      - name: Verify container image
        if: steps.existing_release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker run --detach --name amkr-image-check --publish 18000:8000 "$image:$VERSION" >/dev/null
          # /health 不需要鉴权，30 秒足够首次启动生成配置并拉起服务。
          if ! curl --fail --silent --retry 30 --retry-delay 1 --retry-connrefused \
               http://127.0.0.1:18000/health --output /tmp/health.json; then
            docker logs amkr-image-check
            echo "容器内的 AMKR 未在 30 秒内就绪。"
            exit 1
          fi
          VERSION="$VERSION" python - <<'PY'
          import json
          import os

          health = json.load(open("/tmp/health.json", encoding="utf-8"))
          assert health["status"] == "ok", health
          # 镜像装的是同一棵源码，版本号对不上说明构建上下文串了（例如 COPY 了旧 wheel）。
          assert health["version"] == os.environ["VERSION"], health
          print(f"镜像内版本 {health['version']}，模型数 {len(health['models'])}")
          PY
          docker rm --force amkr-image-check

      - name: Push container image to GHCR
        if: steps.existing_release.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.package.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:$VERSION"
          # latest 只跟正式版走：rc/a/b/dev 这类预发布不能顶掉它（post 是正式维护版，照推）。
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]]; then
            docker push "$image:latest"
          else
            echo "预发布版本 $VERSION，不更新 latest 标签。"
          fi

      - name: Generate release notes
        if: steps.existing_release.outputs.exists == 'false'
        env:
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          notes_path = Path("release-notes.md")
          changelog_path = Path("CHANGELOG.md")
          body = ""

          if changelog_path.exists():
              changelog = changelog_path.read_text(encoding="utf-8")
              version_heading = re.compile(
                  rf"^##\s+\[?v?{re.escape(version)}\]?(?:\s+-\s+.*)?\s*$",
                  re.MULTILINE,
              )
              match = version_heading.search(changelog)
              if match:
                  next_heading = re.search(r"^##\s+", changelog[match.end():], re.MULTILINE)
                  end = match.end() + next_heading.start() if next_heading else len(changelog)
                  body = changelog[match.end():end].strip()

          if not body:
              tags = subprocess.run(
                  ["git", "tag", "--sort=-v:refname"],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.splitlines()
              previous_tag = next((current_tag for current_tag in tags if current_tag != tag), "")
              current_ref = tag if tag in tags else "HEAD"
              revision_range = f"{previous_tag}..{current_ref}" if previous_tag else current_ref
              commits = subprocess.run(
                  ["git", "log", "--pretty=format:- %s (%h)", revision_range],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.strip()
              if commits:
                  title = f"Commits since {previous_tag}" if previous_tag else "Commits"
                  body = f"## {title}\n\n{commits}"
              else:
                  body = f"Release {version}"

          notes_path.write_text(body + "\n", encoding="utf-8")
          PY

      - name: Create GitHub Release
        if: steps.existing_release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
