[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-model-key-router"
version = "4.1.0"
description = "A lightweight local OpenAI-compatible model API key router"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sparrived" },
]
keywords = ["openai", "api-key", "router", "fastapi", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # 作为别人的依赖项时主版本必须设上限：这些库的 minor 版本会改行为，
    # 例如 Starlette 1.x 已经让 starlette.testclient 的 httpx 用法告警。
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "rich>=13.7.0,<15.0.0",
    "tomlkit>=0.13.3,<1.0.0",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "uvicorn>=0.30.0,<1.0.0",
    "websockets>=12.0,<16.0",
]

[project.optional-dependencies]
visitor = [
    "itsdangerous>=2.2.0",
]
test = [
    "pytest>=8.0.0",
]
release = [
    "build>=1.2.0",
    "twine>=5.0.0",
]
dev = [
    "pytest>=8.0.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "itsdangerous>=2.2.0",
]

[project.scripts]
amkr = "auto_model_key_router.main:main"
auto-model-key-router = "auto_model_key_router.main:main"

[project.urls]
Homepage = "https://github.com/Sparrived/auto-model-key-router"
Repository = "https://github.com/Sparrived/auto-model-key-router"
Issues = "https://github.com/Sparrived/auto-model-key-router/issues"
Changelog = "https://github.com/Sparrived/auto-model-key-router/blob/master/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["auto_model_key_router*"]
exclude = [".release-smoke*", ".venv*", "venv*", "build*", "dist*"]

# WebUI 是预构建的静态资产（无构建步骤、零额外依赖），随 wheel 一起发布。
[tool.setuptools.package-data]
auto_model_key_router = ["webui/*", "webui/pages/*"]
